name: iOS

on:
  push:
    branches: [main, ios-app, "feature/**", "feat/**", "fix/**", "codex/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify generated project is current
        run: |
          xcodegen generate --spec ios/project.yml
          git diff --exit-code -- ios/MommyChaogu.xcodeproj
      - name: Build and test
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in data.values() for device in runtime if device["name"].startswith("iPhone")))')
          xcodebuild test \
            -project ios/MommyChaogu.xcodeproj \
            -scheme MommyChaogu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
