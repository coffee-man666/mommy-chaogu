name: MommyChaogu
options:
  bundleIdPrefix: com.coffeeman
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
targets:
  MommyChaogu:
    type: application
    platform: iOS
    sources:
      - MommyChaogu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeman.mommychaogu
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 妈咪炒股
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你的妈咪炒股数据服务与实时行情。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于语音指挥 AI 助手。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 将你的语音指令转成文字并交给 AI 助手。
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: iPhone Developer
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - MommyChaoguTests
  MommyChaoguTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MommyChaoguTests
    dependencies:
      - target: MommyChaogu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeman.mommychaogu.tests
